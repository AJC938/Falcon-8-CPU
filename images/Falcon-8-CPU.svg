<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2f6fb"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182338"/>
      <stop offset="0.55" stop-color="#0b1426"/>
      <stop offset="1" stop-color="#030814"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2d8cff"/>
      <stop offset="0.5" stop-color="#63b1ff"/>
      <stop offset="1" stop-color="#1670e8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0f172a" flood-opacity=".22"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>

  <!-- soft ground shadow -->
  <ellipse cx="700" cy="770" rx="445" ry="62" fill="#8ba1bd" opacity=".18"/>

  <!-- chip -->
  <g filter="url(#shadow)">
    <rect x="315" y="195" width="770" height="520" rx="58" fill="#050b15" stroke="#263957" stroke-width="18"/>
    <rect x="325" y="205" width="750" height="500" rx="50" fill="url(#body)" stroke="url(#edge)" stroke-width="4" filter="url(#glow)"/>
    <rect x="353" y="233" width="694" height="444" rx="38" fill="#0a1324" stroke="#314764" stroke-width="2"/>
    
    <!-- corner screws -->
    <circle cx="385" cy="265" r="16" fill="#101a2b" stroke="#5b7394" stroke-width="3"/>
    <circle cx="1015" cy="265" r="16" fill="#101a2b" stroke="#5b7394" stroke-width="3"/>
    <circle cx="385" cy="645" r="16" fill="#101a2b" stroke="#5b7394" stroke-width="3"/>
    <circle cx="1015" cy="645" r="16" fill="#101a2b" stroke="#5b7394" stroke-width="3"/>

    <!-- falcon mark -->
    <g transform="translate(565,286)">
      <path d="M0 50 L42 24 L96 17 L132 28 L108 39 L70 39 L41 57 L70 57 L55 72 L24 68 Z" fill="#f7fbff"/>
      <path d="M18 38 L55 18 L89 18 L55 34 Z" fill="#2f8cff"/>
      <path d="M35 52 L79 36 L62 55 Z" fill="#2f8cff"/>
      <path d="M58 68 L102 40 L80 72 Z" fill="#2f8cff"/>
      <circle cx="107" cy="28" r="4" fill="#2f8cff"/>
    </g>

    <!-- label -->
    <text x="700" y="490" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="700" letter-spacing="6" fill="#f8fbff">FALCON-<tspan fill="#3596ff">8</tspan></text>
    <rect x="505" y="520" width="390" height="5" rx="2.5" fill="#2f92ff"/>
    <text x="700" y="585" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="600" letter-spacing="8" fill="#eef4fb">8-BIT CPU</text>
  </g>

  <!-- pins -->
