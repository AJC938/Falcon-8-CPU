  <text x="700" y="825" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" letter-spacing="2" fill="#8291a7">CUSTOM 8-BIT SINGLE-CYCLE PROCESSOR</text>
